# Merge into [compose] in aerc.conf (do not replace existing account settings).
# No %s placeholder: aerc substitutes it unescaped into `sh -c`.
# Tab offers up to 99 active, deduplicated email addresses. For filtered queries,
# use TideContacts directly; see docs/mail-clients.md for the upstream limitation.
[compose]
address-book-cmd = tidecontacts contacts query --format aerc --limit 99
