version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    rules:
      # Match TideMail's policy for test helpers and deferred read-handle cleanup.
      - path: _test\.go
        linters: [errcheck]
      - linters: [errcheck]
        text: 'Error return value of `[^`]*\.Close` is not checked'
